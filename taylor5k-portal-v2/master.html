<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#35104d" />
<title>Kent Taylor 5K — Master Planning Document</title>
<style>
:root{--purple:#4b1766;--deep:#2d0b42;--lav:#f3edf6;--gold:#e6bd45;--ink:#1d1920;--muted:#6b626f;--line:#ddd5e2;--paper:#fff;--bg:#eeeaf0;--green:#238451;--orange:#b86b13;--red:#b73333}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}.toolbar{position:sticky;top:0;z-index:20;background:rgba(45,11,66,.97);color:#fff;border-bottom:1px solid #ffffff20;box-shadow:0 8px 28px #1d0a2720}.toolbar-inner{max-width:1120px;margin:auto;min-height:64px;padding:9px 18px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand-logo{width:43px;height:43px;border-radius:50%;background:url('../taylor5k-assets/kent-taylor-5k-logo.svg') center/cover no-repeat;box-shadow:0 0 0 2px #ffffff25}.brand strong{display:block;font-size:15px}.brand small{display:block;font-size:9px;color:#d9c7e2;margin-top:2px}.btn{border:1px solid #ffffff36;background:#ffffff12;color:#fff;border-radius:999px;padding:9px 13px;font-size:10px;font-weight:900;cursor:pointer;text-decoration:none;white-space:nowrap}.btn.primary{background:#fff;color:var(--deep);border-color:#fff}.btn:hover{transform:translateY(-1px)}.doc-shell{width:min(920px,calc(100% - 28px));margin:28px auto 70px}.paper{background:var(--paper);box-shadow:0 18px 55px #2f193a1c;border:1px solid #e4dfe7;border-radius:8px;overflow:hidden}.cover{min-height:520px;padding:58px 58px 50px;background:linear-gradient(145deg,var(--deep),var(--purple));color:#fff;position:relative;overflow:hidden}.cover:after{content:'5K';position:absolute;right:-28px;bottom:-95px;font-size:260px;font-weight:900;color:#ffffff09;line-height:1}.cover-mark{width:94px;height:94px;border-radius:50%;background:url('../taylor5k-assets/kent-taylor-5k-logo.svg') center/cover no-repeat;box-shadow:0 0 0 3px #ffffff22;margin-bottom:34px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#d8bce5}.cover h1{position:relative;z-index:2;font-size:54px;line-height:.92;margin:10px 0 18px;letter-spacing:-.04em;max-width:650px}.cover h1 span{color:#cfacdF}.cover p{position:relative;z-index:2;max-width:620px;color:#ffffffc5;font-size:16px}.cover-meta{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff25;margin-top:42px;border:1px solid #ffffff20;border-radius:12px;overflow:hidden}.cover-meta div{background:#ffffff0d;padding:14px}.cover-meta small{display:block;font-size:8px;color:#d9c5e3;text-transform:uppercase;letter-spacing:.1em}.cover-meta b{display:block;font-size:12px;margin-top:4px}.doc-body{padding:46px 56px 60px}.intro-note{background:var(--lav);border-left:4px solid var(--purple);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:28px;font-size:11px;color:#4e4254}.toc{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:38px}.toc h2{font-size:18px;margin:0 0 12px;color:var(--purple)}.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px}.toc a{text-decoration:none;color:#4c4250;font-size:10px}.toc a b{color:var(--purple)}.chapter,.appendix{margin:0 0 44px;scroll-margin-top:80px}.chapter-head{border-bottom:2px solid var(--purple);padding-bottom:10px;margin-bottom:20px}.chapter-no{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}.chapter h2,.appendix h2{font-size:28px;line-height:1.05;margin:5px 0 0;letter-spacing:-.02em}.chapter-content{font-size:11px;color:#332d36}.chapter-content p{margin:0 0 11px}.chapter-content h3{font-size:13px;margin:20px 0 8px;color:var(--purple);letter-spacing:.04em}.chapter-content ul{margin:4px 0 14px;padding-left:20px}.chapter-content li{margin:4px 0}.table-wrap{width:100%;overflow:auto;margin:10px 0 17px}.doc-table{width:100%;border-collapse:collapse;font-size:9px}.doc-table th{background:var(--purple);color:#fff;text-align:left;padding:7px;border:1px solid var(--purple)}.doc-table td{padding:7px;border:1px solid var(--line);vertical-align:top}.doc-table tr:nth-child(even) td{background:#faf8fb}.appendices-title{margin:58px 0 22px;padding-top:24px;border-top:5px solid var(--deep)}.appendices-title h2{font-size:31px;margin:0}.appendix{padding-top:12px}.appendix .chapter-head{border-bottom-color:#9e6bb7}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900}.critical{background:#fdeaea;color:var(--red)}.high{background:#fff1df;color:var(--orange)}.complete{background:#e4f4ea;color:var(--green)}.muted{color:var(--muted)}.status-message{padding:50px;text-align:center}.status-message h2{color:var(--purple)}.footer-note{margin-top:55px;padding-top:18px;border-top:1px solid var(--line);font-size:8px;color:#817785;display:flex;justify-content:space-between;gap:12px}.print-only{display:none}
@media(max-width:700px){.toolbar-inner{flex-wrap:wrap}.brand{width:100%}.doc-shell{width:100%;margin:0}.paper{border-radius:0;border:0}.cover{padding:38px 25px;min-height:auto}.cover h1{font-size:44px}.cover-meta{grid-template-columns:1fr}.doc-body{padding:32px 22px}.toc-grid{grid-template-columns:1fr}.chapter h2,.appendix h2{font-size:24px}}
@media print{@page{size:Letter;margin:.52in}.no-print{display:none!important}.print-only{display:block}body{background:#fff;font-size:9pt}.doc-shell{width:auto;margin:0}.paper{box-shadow:none;border:0;border-radius:0}.cover{min-height:9.4in;padding:.45in;background:var(--deep)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:page}.cover h1{font-size:38pt}.doc-body{padding:0}.toc{break-after:page}.chapter{break-before:page;margin:0}.chapter:first-of-type{break-before:auto}.appendices-title{break-before:page}.appendix{break-before:page;margin:0}.chapter-content{font-size:8.7pt}.chapter-content h3{font-size:10pt}.doc-table{font-size:7.2pt}.doc-table th{background:var(--purple)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.doc-table tr:nth-child(even) td{background:#f8f6f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.table-wrap{overflow:visible}.footer-note{font-size:6.5pt}}
</style>
</head>
<body>
<header class="toolbar no-print"><div class="toolbar-inner"><div class="brand"><span class="brand-logo"></span><span><strong>Kent Taylor 5K Master Planning Document</strong><small>Standalone live document · Portal v3.2.1</small></span></div><a class="btn" href="./?v=3.2.1">← Back to Portal</a><button class="btn" id="refreshBtn">↻ Refresh Live Data</button><button class="btn primary" id="printBtn">Print / Save PDF</button></div></header>
<main class="doc-shell"><article class="paper" id="document"><div class="status-message"><h2>Loading live Master Planning Document…</h2><p class="muted">Reading the current Taylor 5K planning database.</p></div></article></main>
<script>
const BASE='https://vofnxwgjqxgahjiobtqw.supabase.co';
const KEY='sb_publishable_oEUGCcdpWX94DD7wOZv5Pw_3d8O6Bog';
const SESSION_KEY='t5k_session';
const TABLES=['chapters','tasks','decisions','permits','budget_lines','sponsors','sponsor_opportunities','festival_items','swag_items','marketing_assets','team_members'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
let session=null,db={};
function savedSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
async function refreshSession(s){if(!s?.refresh_token)return null;const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok)return null;const next={access_token:j.access_token,refresh_token:j.refresh_token||s.refresh_token,user:j.user};localStorage.setItem(SESSION_KEY,JSON.stringify(next));return next}
async function validSession(){let s=savedSession();if(!s?.access_token)return null;let r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});if(r.ok)return s;s=await refreshSession(s);if(!s)return null;r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});return r.ok?s:null}
function headers(){return{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}}
async function get(path){const r=await fetch(BASE+path,{headers:headers()});const j=await r.json();if(!r.ok)throw Error(j?.message||j?.error||'Request failed');return j}
async function load(){session=await validSession();if(!session){showSignedOut();return}try{const calls=TABLES.map(async t=>{let order='';if(t==='chapters')order='&order=chapter_no.asc';else if(t==='tasks')order='&order=created_at.asc';else if(t==='decisions')order='&order=created_at.asc';const rows=await get('/rest/v1/'+t+'?select=*'+order+'&limit=500');db[t]=rows});await Promise.all(calls);render()}catch(e){document.querySelector('#document').innerHTML='<div class="status-message"><h2>Could not load the Master Plan.</h2><p>'+esc(e.message)+'</p><p><a class="btn" style="background:#4b1766;color:white" href="./?v=3.2.1">Return to Portal</a></p></div>'}}
function showSignedOut(){document.querySelector('#document').innerHTML='<div class="status-message"><h2>Portal sign-in required</h2><p>This is a private live planning document. Open the portal, sign in, then choose Full Master Planning Doc again.</p><p><a class="btn" style="background:#4b1766;color:white" href="./?v=3.2.1">Open Taylor 5K Portal</a></p></div>'}
function isUpperHeading(line){const s=line.trim();return s.length>2&&s.length<90&&s===s.toUpperCase()&&/[A-Z]/.test(s)&&!s.includes('|')&&!/^[-•]/.test(s)}
function renderBody(text){const lines=String(text||'').replace(/\r/g,'').split('\n');let html='',i=0;while(i<lines.length){const raw=lines[i],line=raw.trim();if(!line){i++;continue}if(line.startsWith('- ')){let items=[];while(i<lines.length&&lines[i].trim().startsWith('- ')){items.push(lines[i].trim().slice(2));i++}html+='<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';continue}if(line.includes('|')){let group=[];while(i<lines.length&&lines[i].trim()&&lines[i].includes('|')){group.push(lines[i].trim());i++}html+=renderPipeTable(group);continue}if(isUpperHeading(line)){html+='<h3>'+esc(line)+'</h3>';i++;continue}html+='<p>'+esc(line)+'</p>';i++}return html}
function renderPipeTable(lines){const clean=lines.filter(x=>!/^\s*-+\s*(\|\s*-+\s*)+$/.test(x));if(!clean.length)return'';const rows=clean.map(x=>x.split('|').map(c=>c.trim()));const header=lines.some(x=>/^\s*-+\s*(\|\s*-+\s*)+$/.test(x));const cols=Math.max(...rows.map(r=>r.length));let h='<div class="table-wrap"><table class="doc-table">';rows.forEach((r,idx)=>{h+='<tr>';for(let c=0;c<cols;c++){const tag=header&&idx===0?'th':'td';h+='<'+tag+'>'+esc(r[c]||'')+'</'+tag+'>'}h+='</tr>'});return h+'</table></div>'}
function table(headers,rows){return '<div class="table-wrap"><table class="doc-table"><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+String(c??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function statusPill(s){const v=esc(s||'');const l=String(s||'').toLowerCase();const cls=l.includes('complete')||l.includes('approved')||l.includes('cleared')?'complete':l.includes('critical')||l.includes('overdue')?'critical':l.includes('high')||l.includes('decision')?'high':'';return '<span class="pill '+cls+'">'+v+'</span>'}
function cover(){return `<section class="cover"><div class="cover-mark"></div><div class="eyebrow">PRIVATE PLANNING DOCUMENT · FALL 2027</div><h1>KENT TAYLOR 5K<br><span>MASTER PLANNING DOCUMENT</span></h1><p>Live working master for the inaugural Kent Taylor 5K and community festival in Norton, Massachusetts. Run. Remember. Give Back.</p><div class="cover-meta"><div><small>Event Window</small><b>Fall 2027 · Date TBD</b></div><div><small>Home Base</small><b>Norton High School</b></div><div><small>Document Source</small><b>Live Planning Portal</b></div></div></section>`}
function toc(chapters){return `<section class="toc"><h2>Contents</h2><div class="toc-grid">${chapters.map(c=>`<a href="#chapter-${c.chapter_no}"><b>${String(c.chapter_no).padStart(2,'0')}</b> · ${esc(c.title)}</a>`).join('')}<a href="#appendices"><b>A–J</b> · Live Planning Appendices</a></div></section>`}
function appendix(title,id,content){return `<section class="appendix" id="${id}"><div class="chapter-head"><div class="chapter-no">Live Appendix</div><h2>${esc(title)}</h2></div>${content}</section>`}
function renderAppendices(){const tasks=db.tasks||[],dec=db.decisions||[],perm=db.permits||[],bud=db.budget_lines||[],sp=db.sponsors||[],ops=db.sponsor_opportunities||[],fest=db.festival_items||[],swag=db.swag_items||[],mk=db.marketing_assets||[],team=db.team_members||[];const open=tasks.filter(x=>String(x.status||'').toLowerCase()!=='complete');const totalPlanned=bud.filter(x=>x.line_type==='Expense').reduce((s,x)=>s+Number(x.budget_amount||0),0);const totalActual=bud.filter(x=>x.line_type==='Expense').reduce((s,x)=>s+Number(x.actual_amount||0),0);return `<section class="appendices-title" id="appendices"><div class="eyebrow" style="color:var(--purple)">LIVE DATA</div><h2>Planning Appendices</h2><p class="muted">Generated from the current portal database at ${esc(new Date().toLocaleString())}.</p></section>
${appendix('Appendix A — Open Tasks','app-a',table(['Priority','Task','Category','Owner','Status','Due'],open.map(x=>[statusPill(x.priority),esc(x.title),esc(x.category||''),esc(x.owner_name||'Unassigned'),statusPill(x.status),esc(x.due_date||'—')]))) }
${appendix('Appendix B — Open Decisions','app-b',table(['Decision','Status','Current Decision / Context'],dec.map(x=>[esc(x.title),statusPill(x.status),esc(x.decision||x.context||'')])) )}
${appendix('Appendix C — Permits & Safety','app-c',table(['Approval / Permit','Authority','Owner','Status','Due'],perm.map(x=>[esc(x.approval),esc(x.authority||''),esc(x.owner_name||'Unassigned'),statusPill(x.status),esc(x.due_date||'—')])) )}
${appendix('Appendix D — Working Budget','app-d',`<p><b>Planned expenses:</b> ${money(totalPlanned)} &nbsp; · &nbsp; <b>Actual recorded:</b> ${money(totalActual)}</p>`+table(['Type','Category','Item','Budget','Actual','Status'],bud.map(x=>[esc(x.line_type),esc(x.category),esc(x.item),money(x.budget_amount),money(x.actual_amount),statusPill(x.paid_status)])) )}
${appendix('Appendix E — Sponsor Pipeline','app-e',table(['Sponsor','Stage','Level','Ask','Committed','Owner'],sp.map(x=>[esc(x.name),statusPill(x.stage),esc(x.level||''),money(x.ask_amount),money(x.committed_amount),esc(x.owner_name||'')])) )}
${appendix('Appendix F — Sponsor Opportunities','app-f',table(['Type','Opportunity','Target','Status'],ops.map(x=>[esc(x.opportunity_type),esc(x.name),money(x.target_amount),statusPill(x.status)])) )}
${appendix('Appendix G — Community Festival','app-g',fest.length?table(['Item','Status','Owner','Budget','Vendor'],fest.map(x=>[esc(x.name),statusPill(x.status),esc(x.owner_name||''),money(x.budget_amount),esc(x.vendor||'')])):'<p class="muted">No festival records entered yet.</p>')}
${appendix('Appendix H — Runner Swag','app-h',swag.length?table(['Item','Audience','Status','Qty','Unit Cost','Vendor'],swag.map(x=>[esc(x.item),esc(x.audience||''),statusPill(x.status),esc(x.quantity||''),money(x.unit_cost),esc(x.vendor||'')])):'<p class="muted">No swag records entered yet.</p>')}
${appendix('Appendix I — Marketing Library','app-i',mk.length?table(['Asset','Type','Status','Campaign','Channel'],mk.map(x=>[esc(x.title),esc(x.asset_type),statusPill(x.status),esc(x.campaign||''),esc(x.channel||'')])):'<p class="muted">No Marketing Library records entered yet.</p>')}
${appendix('Appendix J — Team & Access','app-j',table(['Member','Role','Active'],team.map(x=>[esc(x.display_name||'Member'),esc(String(x.role||'').replaceAll('_',' ')),x.active?'Yes':'No'])) )}`}
function render(){const chapters=(db.chapters||[]).slice().sort((a,b)=>a.chapter_no-b.chapter_no);const html=cover()+`<div class="doc-body"><div class="intro-note"><b>Live-document behavior:</b> the 18 narrative chapters come directly from the current Master Plan database. The appendices below are rebuilt from live tasks, decisions, permits, budget, sponsor, festival, swag, marketing, and team data whenever this page is refreshed.</div>`+toc(chapters)+chapters.map(c=>`<section class="chapter" id="chapter-${c.chapter_no}"><div class="chapter-head"><div class="chapter-no">Chapter ${String(c.chapter_no).padStart(2,'0')} · ${esc(c.status||'Live')}</div><h2>${esc(c.title)}</h2></div><div class="chapter-content">${renderBody(c.body)}</div></section>`).join('')+renderAppendices()+`<div class="footer-note"><span>Kent Taylor 5K · Run. Remember. Give Back.</span><span>Live Master Planning Document · Portal v3.2.1</span></div></div>`;document.querySelector('#document').innerHTML=html;document.title='Kent Taylor 5K — Master Planning Document';if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>window.print(),450)}
document.querySelector('#printBtn').onclick=()=>window.print();document.querySelector('#refreshBtn').onclick=()=>load();load();
</script>
</body>
</html>
